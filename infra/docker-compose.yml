# S0-T2-1 local stack: PostgreSQL + pgvector, Redis, FastAPI.
# Usage (from the repo root):
#   cp .env.example .env
#   cd infra && docker compose up --build
# Local-only dev credentials (aqarai/aqarai) as in the task sheet. Not a secret:
# production uses NEON_DATABASE_URL / UPSTASH_REDIS_URL from .env.

name: aqarai

services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: aqarai
      POSTGRES_PASSWORD: aqarai
      POSTGRES_DB: aqarai
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Runs only on the first start (empty volume). Enables pgvector.
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aqarai -d aqarai"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: ../backend
    env_file:
      # Optional so a fresh clone starts without a .env (the sheet's second-computer test).
      # Needs Docker Compose 2.24 or newer.
      - path: ../.env
        required: false
    environment:
      # Overrides any value from .env: inside compose the hosts are the service names.
      DATABASE_URL: postgresql://aqarai:aqarai@db:5432/aqarai
      REDIS_URL: redis://redis:6379/0
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
