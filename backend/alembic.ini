# S1-T2-1 Alembic config. Run from backend/:
#   DATABASE_URL=postgresql://aqarai:aqarai@localhost:5432/aqarai alembic upgrade head
# The database URL is read from the DATABASE_URL environment variable in
# app/db/migrations/env.py. No URL or password is stored in this file.

[alembic]
script_location = app/db/migrations
prepend_sys_path = .
file_template = %%(rev)s_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
